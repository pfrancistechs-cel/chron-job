version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8087:8087"
    environment:
      - PORT=8087
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3007:3007"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8087
    depends_on:
      - backend
    restart: unless-stopped
